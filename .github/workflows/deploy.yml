name: Deploy Japanese Academy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. الانتقال إلى مسار المشروع على الخادم
            cd /var/www/japanese-academy
            
            # 2. جلب أحدث التعديلات البرمجية من مستودع GitHub
            git pull origin main
            
            # 3. إعادة بناء الحاويات وتطبيق التحديثات
            docker compose up -d --build
            
            # 4. تنفيذ أوامر Laravel داخل حاوية الخلفية الجديدة (ja_backend)
            docker compose exec -T ja_backend php artisan migrate --force
            docker compose exec -T ja_backend php artisan config:cache
            docker compose exec -T ja_backend php artisan route:cache
            docker compose exec -T ja_backend php artisan view:cache
            
            # 5. تنظيف الصور القديمة لتوفير المساحة
            docker image prune -f